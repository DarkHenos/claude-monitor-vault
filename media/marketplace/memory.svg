<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="690" viewBox="0 0 1200 690"><rect width="1200" height="690" fill="#141c24"/><g font-family="Segoe UI, Arial, sans-serif"><text x="64" y="68" fill="#6ec5b4" font-size="18" font-weight="600">02 / PROJECT MEMORY</text><text x="64" y="124" fill="#f2f4f6" font-size="42" font-weight="600">Keep context when you switch.</text><text x="64" y="170" fill="#bbc3cb" font-size="23" font-weight="400">Linked files are discovered. Changes are reviewed. Existing notes are preserved.</text><rect x="64" y="220" width="315" height="226" rx="12" fill="#202a34"/><text x="88" y="260" fill="#d9977e" font-size="17" font-weight="600">1  DISCOVER</text><text x="88" y="310" fill="#f2f4f6" font-size="25" font-weight="600">MEMORY.md</text><text x="88" y="352" fill="#bbc3cb" font-size="20" font-weight="400">↳ user_profile.md</text><text x="88" y="389" fill="#bbc3cb" font-size="20" font-weight="400">↳ project_decisions.md</text><text x="88" y="423" fill="#bbc3cb" font-size="20" font-weight="400">↳ other linked files…</text><rect x="443" y="220" width="315" height="226" rx="12" fill="#202a34"/><text x="467" y="260" fill="#d9977e" font-size="17" font-weight="600">2  REVIEW</text><text x="467" y="310" fill="#f2f4f6" font-size="24" font-weight="600">Inventory + differences</text><text x="467" y="352" fill="#bbc3cb" font-size="20" font-weight="400">Included / missing / skipped</text><text x="467" y="389" fill="#bbc3cb" font-size="20" font-weight="400">Preview before applying</text><text x="467" y="423" fill="#bbc3cb" font-size="20" font-weight="400">Local backups for changes</text><rect x="822" y="220" width="314" height="226" rx="12" fill="#202a34"/><text x="846" y="260" fill="#6ec5b4" font-size="17" font-weight="600">3  SHARE</text><text x="846" y="310" fill="#f2f4f6" font-size="25" font-weight="600">Project notes</text><text x="846" y="352" fill="#bbc3cb" font-size="19" font-weight="400">.agent-bridge/MEMORY.md</text><text x="846" y="389" fill="#bbc3cb" font-size="19" font-weight="400">CLAUDE.md → shared notes</text><text x="846" y="423" fill="#bbc3cb" font-size="19" font-weight="400">AGENTS.md → shared notes</text><text x="399" y="342" fill="#6ec5b4" font-size="30" font-weight="400">→</text><text x="778" y="342" fill="#6ec5b4" font-size="30" font-weight="400">→</text><path d="M64 501H1136V501" stroke="#3c4854" stroke-width="2" fill="none"/><text x="64" y="550" fill="#f2f4f6" font-size="28" font-weight="600">Different filenames. One inventory. No duplicate imports.</text><text x="64" y="599" fill="#bbc3cb" font-size="22" font-weight="400">Shares local project files, not chat history or personal ChatGPT web memories.</text></g></svg>