<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Activity-bar icon: a gauge dial whose hub is a Claude-inspired spark that
       bursts up into the scale. One glyph for the two halves of the extension,
       the rate-limit gauge and the vault. Inspired by, and deliberately distinct
       from, the Claude mark (five rays, its own proportions). Monochrome and
       stroke-only: the activity bar recolours it per theme via currentColor.
       The group is scaled up about the centre so the glyph fills more of the
       24x24 box: it read too small at the default size. -->
  <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(12 12) scale(1.3) translate(-12 -12)">
    <!-- the dial: an arc a touch over a semicircle -->
    <path d="M4 15.5a8 8 0 0 1 16 0"/>
    <!-- the spark hub, rising from the base of the dial as the needle -->
    <path d="M12 15.5V8.6"/>
    <path d="M12 15.5 8.9 12.4"/>
    <path d="M12 15.5 15.1 12.4"/>
    <path d="M12 15.5H8.3"/>
    <path d="M12 15.5H15.7"/>
  </g>
</svg>
