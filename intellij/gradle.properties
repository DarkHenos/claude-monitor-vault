# IntelliJ build the plugin is compiled against. The plugin declares 231 as its
# floor and no ceiling, so it installs in 2023.1 and every later release.
platformVersion=2023.1.3

# To compile against an IDE already installed instead of downloading one, pass
# -PplatformLocalPath="C:/Program Files/JetBrains/IntelliJ IDEA 2023.1.3"
# (build.ps1 does it when it finds that folder).

# The IDE ships its own Kotlin runtime; bundling a second one is an error.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
